name: CI

# Runs the portal the way a client uses it and publishes what it saw.
# The screenshots are attached to every run as an artifact, so a change can be
# looked at from GitHub rather than only read as a diff.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: PHP syntax
        run: |
          status=0
          while IFS= read -r file; do
            php -l "$file" || status=1
          done < <(find . -name '*.php' -not -path './vendor/*')
          exit $status

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax
        run: |
          status=0
          for file in theme.js hx-motion.js site.js dashboard.js; do
            node --check "$file" || status=1
          done
          node --check tests/smoke.mjs || status=1
          exit $status

      - name: Stylesheets are balanced and keyframes resolve
        run: python3 tests/css-check.py

      - name: TOTP library (RFC 6238 vectors, backup codes)
        run: php tests/totp-test.php

      - name: Bitcoin address validation (BIP-173 / BIP-350 vectors)
        run: php tests/btc-test.php

      - name: Statement figures (amount parser, monthly grouping)
        run: php tests/statements-test.php

      - name: No client data committed
        run: |
          # data/users.json holds plaintext passwords and KYC details; it must
          # never be tracked. Fail loudly rather than leak it in a future commit.
          if git ls-files --error-unmatch data/users.json 'data.*/users.json' data/tickets.json 2>/dev/null; then
            echo "::error::client data files are tracked by git — they must stay untracked"
            exit 1
          fi
          echo "no client data tracked"

  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Seed synthetic data
        run: |
          # The real data directory is untracked, so CI supplies its own
          # fixture. It contains no personal data of any kind.
          mkdir -p data
          cp tests/fixtures/users.json data/users.json

      - name: Start the app
        run: |
          php -S 127.0.0.1:8899 -t . > php-server.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8899/login.html; then
              echo "server up"; exit 0
            fi
            sleep 1
          done
          echo "server did not start"; cat php-server.log; exit 1

      - name: Run smoke test
        run: node tests/smoke.mjs

      - name: Two-factor flow
        run: node tests/twofactor-test.js

      - name: Support centre flow
        run: node tests/support-test.js

      - name: Bitcoin withdrawal flow
        run: node tests/btc-withdrawal-test.js

      - name: Statements page and PDF download
        run: node tests/statements-page-test.js

      - name: Verification (document upload, access control, sessions)
        run: node tests/verification-test.js

      - name: Publish screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/screenshots/
          if-no-files-found: warn

      - name: Server log
        if: failure()
        run: cat php-server.log
