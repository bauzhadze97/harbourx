<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>შესვლა — {{ cfg.site_title }}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="login-wrap">
  <form class="card login-card" method="post" action="/admin/login">
    <div class="brand" style="margin-bottom:16px">
      <div class="brand-dot">🌶️</div>
      <div><b>{{ cfg.site_title }}</b><span>ადმინ-პანელი</span></div>
    </div>
    {% if error %}<div class="err">⚠️ {{ error }}</div>{% endif %}
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="field">
      <label for="u">მომხმარებელი</label>
      <input id="u" name="username" autocomplete="username" autofocus required>
    </div>
    <div class="field">
      <label for="p">პაროლი</label>
      <input id="p" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn" style="width:100%;justify-content:center">შესვლა</button>
  </form>
</div>
</body>
</html>
