<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ადმინი{% endblock %} — {{ cfg.site_title }}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="brand-dot">🌶️</div>
      <div><b>{{ cfg.site_title }}</b><span>ადმინ-პანელი</span></div>
    </div>
    <nav class="nav">
      <a href="/admin" class="{{ 'on' if page == 'dash' }}">📊 მთავარი</a>
      <a href="/admin/catalog" class="{{ 'on' if page == 'catalog' }}">🏢 კატალოგი</a>
      <a href="/admin/orders" class="{{ 'on' if page == 'orders' }}">📦 შეკვეთები</a>
      <a href="/admin/disputes" class="{{ 'on' if page == 'disputes' }}">🔍 დავები
        {% if open_disputes %}<span class="pill">{{ open_disputes }}</span>{% endif %}</a>
      <a href="/admin/reviews" class="{{ 'on' if page == 'reviews' }}">⭐️ შეფასებები</a>
      <a href="/admin/users" class="{{ 'on' if page == 'users' }}">👥 მომხმარებლები</a>
      <a href="/admin/deposits" class="{{ 'on' if page == 'deposits' }}">💰 შევსებები</a>
      <a href="/admin/settings" class="{{ 'on' if page == 'settings' }}">⚙️ პარამეტრები</a>
      <a href="/admin/preview" class="{{ 'on' if page == 'preview' }}">🤖 ბოტის გადახედვა</a>
      <a href="/admin/logs" class="{{ 'on' if page == 'logs' }}">🧾 ჟურნალი</a>
      <a href="/" target="_blank">🌐 საიტი ↗</a>
    </nav>
    <form method="post" action="/admin/logout" style="margin-top:14px">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="btn ghost sm" style="width:100%;justify-content:center">გასვლა</button>
    </form>
  </aside>
  <main class="main">
    {% if flash %}<div class="flash">{{ flash }}</div>{% endif %}
    {% block body %}{% endblock %}
  </main>
</div>
</body>
</html>
